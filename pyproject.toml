[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beliefkv"
version = "0.1.0"
description = "Belief-aware KV lifecycle management for single-GPU multi-agent serving."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
agents = [
    "deepagents==0.6.12",
    "langchain==1.3.14",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "nvidia-ml-py==13.610.43",
    "psutil==7.2.2",
    "requests==2.34.2",
]

[project.scripts]
beliefkv = "beliefkv.cli:main"

[tool.setuptools.packages.find]
include = ["beliefkv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
